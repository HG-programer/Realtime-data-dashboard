<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Data Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0a2239;
            --bg-soft: #103a5d;
            --card: #ffffff;
            --accent: #ffb703;
            --ink: #1f2933;
            --muted: #4b5d70;
            --ok: #2a9d8f;
            --panel-line: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", sans-serif;
            background: radial-gradient(circle at 15% 20%, #1a5a86 0%, var(--bg) 45%), linear-gradient(120deg, #0a2239, #061520);
            color: #f7fbff;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .panel {
            width: min(980px, 100%);
            background: color-mix(in srgb, var(--bg-soft) 82%, transparent);
            border: 1px solid var(--panel-line);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(6px);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            letter-spacing: 0.03em;
        }

        .status {
            margin: 0;
            color: #d4ebff;
            font-size: 0.95rem;
        }

        .header {
            display: grid;
            gap: 12px;
            margin-bottom: 18px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button,
        input[type="text"],
        input[type="number"] {
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        button {
            cursor: pointer;
            background: linear-gradient(135deg, #ffd166, #ffb703);
            color: #2b2b2b;
            border: none;
            font-weight: 700;
        }

        button:hover {
            filter: brightness(1.05);
        }

        .toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .layout {
            display: grid;
            gap: 18px;
            grid-template-columns: 1.2fr 1fr;
            align-items: start;
        }

        .card {
            border: 1px solid var(--panel-line);
            border-radius: 14px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.06);
        }

        .card h2 {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #eaf5ff;
            letter-spacing: 0.02em;
        }

        .leader {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: linear-gradient(90deg, #ffd166, #fca311);
            color: #1d2429;
            font-weight: 800;
        }

        .form {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 120px auto;
            margin-bottom: 14px;
        }

        .search {
            margin-bottom: 14px;
        }

        .grid {
            display: grid;
            gap: 12px;
            max-height: 460px;
            overflow: auto;
            padding-right: 4px;
        }

        .row {
            background: var(--card);
            color: var(--ink);
            border-radius: 12px;
            padding: 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .row:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(6, 21, 32, 0.18);
        }

        .name {
            font-weight: 700;
            color: var(--ink);
        }

        .meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .bar-track {
            margin-top: 10px;
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #e8eef4;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: var(--pct, 0%);
            background: linear-gradient(90deg, #2a9d8f, #84d67f, #ffd166);
            transition: width 0.3s ease;
        }

        .votes {
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--ok);
            background: color-mix(in srgb, var(--accent) 30%, white);
            padding: 8px 12px;
            border-radius: 10px;
            min-width: 92px;
            text-align: center;
        }

        .chart-wrap {
            min-height: 320px;
        }

        #chart {
            width: 100%;
            height: 100%;
        }

        .empty {
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #e3f2ff;
        }

        @media (max-width: 860px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="panel">
        <header class="header">
            <h1>Real-time Data Dashboard</h1>
            <p id="status" class="status">Loading latest results...</p>
            <div class="toolbar">
                <button onclick="loadResults()">Refresh</button>
                <label class="toggle">
                    <input type="checkbox" id="autoToggle" checked />
                    Auto refresh
                </label>
            </div>
        </header>

        <section class="layout">
            <div class="card">
                <h2>Live Data Feed</h2>
                <div class="form">
                    <input id="name" type="text" placeholder="Candidate name" />
                    <input id="votes" type="number" min="0" placeholder="Votes" />
                    <button onclick="updateVote()">Update</button>
                </div>
                <input id="search" class="search" type="text" placeholder="Search candidate" />
                <div id="leader" class="leader">Leader: waiting for data...</div>
                <section id="results" class="grid"></section>
            </div>

            <div class="card chart-wrap">
                <h2>Metric Distribution</h2>
                <canvas id="chart"></canvas>
            </div>
        </section>

        <p style="text-align:center; opacity:0.6; margin-top:10px;">
            Built by Haru • Docker + Flask + PostgreSQL
        </p>
    </main>

    <script>
        const statusEl = document.getElementById("status");
        const resultsEl = document.getElementById("results");
        const leaderEl = document.getElementById("leader");
        const searchEl = document.getElementById("search");
        const autoToggleEl = document.getElementById("autoToggle");

        let chart;
        let auto = true;
        let latestData = [];

        autoToggleEl.addEventListener("change", (event) => {
            auto = event.target.checked;
        });

        searchEl.addEventListener("input", () => {
            renderResults(latestData);
            renderChart(latestData);
        });

        function formatTime(isoString) {
            const date = new Date(isoString);
            return Number.isNaN(date.getTime()) ? "n/a" : date.toLocaleString();
        }

        function filterData(data) {
            const query = searchEl.value.trim().toLowerCase();
            if (!query) {
                return data;
            }
            return data.filter((item) => item.candidate.toLowerCase().includes(query));
        }

        function renderLeader(data) {
            if (!Array.isArray(data) || data.length === 0) {
                leaderEl.textContent = "Leader: no data";
                return;
            }
            const leader = data[0];
            leaderEl.textContent = `Leader: ${leader.candidate} (${leader.votes} votes)`;
        }

        function renderChart(data) {
            const filtered = filterData(data);
            const labels = filtered.map((item) => item.candidate);
            const votes = filtered.map((item) => item.votes);

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(document.getElementById("chart"), {
                type: "bar",
                data: {
                    labels,
                    datasets: [
                        {
                            label: "Votes",
                            data: votes,
                            borderWidth: 1,
                            backgroundColor: ["#2a9d8f", "#84d67f", "#ffd166", "#ffb703", "#fb8500", "#219ebc"],
                        },
                    ],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#eaf5ff",
                            },
                        },
                    },
                    scales: {
                        x: {
                            ticks: { color: "#eaf5ff" },
                            grid: { color: "rgba(255,255,255,0.12)" },
                        },
                        y: {
                            ticks: { color: "#eaf5ff" },
                            grid: { color: "rgba(255,255,255,0.12)" },
                            beginAtZero: true,
                        },
                    },
                },
            });
        }

        function renderResults(data) {
            const filtered = filterData(data);
            if (!Array.isArray(filtered) || filtered.length === 0) {
                resultsEl.innerHTML = '<div class="empty">No results yet.</div>';
                return;
            }

            const maxVotes = Math.max(...filtered.map((item) => item.votes), 1);

            resultsEl.innerHTML = filtered
                .map(
                    (item, index) => {
                        const pct = Math.max((item.votes / maxVotes) * 100, 2).toFixed(1);
                        return `
                        <article class="row">
                            <div>
                                <div class="name">#${index + 1} ${item.candidate}</div>
                                <div class="meta">Updated: ${formatTime(item.updated_at)}</div>
                                <div class="bar-track">
                                    <div class="bar-fill" style="--pct:${pct}%"></div>
                                </div>
                            </div>
                            <div class="votes">${item.votes} votes</div>
                        </article>
                    `;
                    }
                )
                .join("");
        }

        async function updateVote() {
            const candidate = document.getElementById("name").value.trim();
            const votes = Number.parseInt(document.getElementById("votes").value, 10);

            if (!candidate) {
                statusEl.textContent = "Candidate name is required.";
                return;
            }

            if (!Number.isInteger(votes) || votes < 0) {
                statusEl.textContent = "Votes must be a non-negative integer.";
                return;
            }

            try {
                const response = await fetch("/api/results", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ candidate, votes }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                statusEl.textContent = "Vote updated successfully.";
                await loadResults();
            } catch (error) {
                statusEl.textContent = "Failed to update vote.";
            }
        }

        async function loadResults() {
            try {
                const response = await fetch("/api/results");
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                latestData = Array.isArray(data) ? data : [];
                renderResults(data);
                renderLeader(data);
                renderChart(data);
                statusEl.textContent = `Live data refreshed at ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                statusEl.textContent = "Unable to load data. Check backend/database services.";
                resultsEl.innerHTML = '<div class="empty">Fetch failed.</div>';
                leaderEl.textContent = "Leader: unavailable";
            }
        }

        loadResults();
        setInterval(() => {
            if (auto) {
                loadResults();
            }
        }, 5000);
    </script>
</body>
</html>
