services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haru-backend
    ports:
      - "5000:5000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: haru_db
      POSTGRES_USER: haru
      POSTGRES_PASSWORD: haru123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: haru-db
    environment:
      POSTGRES_DB: haru_db
      POSTGRES_USER: haru
      POSTGRES_PASSWORD: haru123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haru -d haru_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
